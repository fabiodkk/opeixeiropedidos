plugins {
    id 'com.android.application'
}

def cfg = new Properties()
def cfgFile = rootProject.file('../supabase.properties')
if (cfgFile.exists()) {
    cfgFile.withInputStream { cfg.load(it) }
}

// O painel embarcado e o cliente nativo precisam usar o mesmo projeto. Durante
// a transição de chaves, o painel é a fonte local canônica para evitar gerar um
// APK com uma chave antiga que já não é aceita pelo Supabase.
def embeddedPanelFile = project.file('src/main/assets/indexmotorista.html')
def supabaseUrlValue = cfg.getProperty('SUPABASE_URL', '')
def supabaseAnonKeyValue = cfg.getProperty('SUPABASE_ANON_KEY', '')
if (embeddedPanelFile.exists()) {
    def panelHtml = embeddedPanelFile.getText('UTF-8')
    def urlMatch = panelHtml =~ /const SUPABASE_URL = '([^']+)'/
    def keyMatch = panelHtml =~ /const SUPABASE_KEY = '([^']+)'/
    if (urlMatch.find()) supabaseUrlValue = urlMatch.group(1)
    if (keyMatch.find()) supabaseAnonKeyValue = keyMatch.group(1)
}

android {
    namespace 'br.com.opeixeiro.motorista'
    compileSdk 36

    signingConfigs {
        release {
            def ks = rootProject.file('keystore.properties')
            if (ks.exists()) {
                def props = new Properties()
                ks.withInputStream { props.load(it) }
                storeFile rootProject.file(props.getProperty('storeFile', ''))
                storePassword props.getProperty('storePassword', '')
                keyAlias props.getProperty('keyAlias', '')
                keyPassword props.getProperty('keyPassword', '')
            }
        }
    }

    defaultConfig {
        applicationId 'br.com.opeixeiro.motorista'
        minSdk 23
        targetSdk 36
        versionCode 37
        versionName '1.4.14'

        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrlValue.replace('"', '\\"') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + supabaseAnonKeyValue.replace('"', '\\"') + '"'
    }

    flavorDimensions 'perfil'
    productFlavors {
        motorista {
            dimension 'perfil'
            buildConfigField 'boolean', 'CUMIN_APP', 'false'
            resValue 'string', 'app_name', 'O Peixeiro Motorista'
        }
        cumin {
            dimension 'perfil'
            applicationIdSuffix '.cumin'
            versionNameSuffix '-cumim'
            buildConfigField 'boolean', 'CUMIN_APP', 'true'
            resValue 'string', 'app_name', 'O Peixeiro Cumim'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Detecção facial local via Google Play Services; o modelo é baixado no aparelho.
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    implementation 'androidx.camera:camera-core:1.5.1'
    implementation 'androidx.camera:camera-camera2:1.5.1'
    implementation 'androidx.camera:camera-lifecycle:1.5.1'
    implementation 'androidx.camera:camera-view:1.5.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime:2.9.1'
    
    // ZXing - QR Code scanner/decoder
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.38'
}




